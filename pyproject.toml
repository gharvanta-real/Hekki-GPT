[project]
name = "mariano"
version = "1.0.0"
description = "MARIANO - Autonomous AI Agent System"
requires-python = ">=3.12"
dependencies = [
    "google-generativeai>=0.8.0",
    "google-genai>=0.8.0",
    "chromadb>=0.5.0",
    "aiosqlite>=0.20.0",
    "textual>=0.80.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "duckduckgo-search>=6.0.0",
    "yfinance>=0.2.40",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.3.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "send2trash>=1.8.0",
]

[project.scripts]
mariano = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mariano"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
