<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hekki Super AI Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    :root {
      --bg: #FFFFFF;
      --card-bg: #F6F7F9;
      --text: #1E293B;
      --text-muted: #64748B;
      --accent: #2563EB;
      --accent-light: rgba(37, 99, 235, 0.1);
      --hover: #EFF6FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181B;
        --card-bg: #27272A;
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --accent: #3B82F6;
        --accent-light: rgba(59, 130, 246, 0.15);
        --hover: #3F3F46;
      }
    }

    body {
      font-family: 'Open Sans', -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    #overlay-card {
      background: var(--bg);
      border-radius: 16px;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: none !important;
      box-shadow: none !important;
    }

    /* Top Drag Header */
    .header-bar {
      height: 40px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      -webkit-app-region: drag;
      cursor: move;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Content Body */
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .welcome-hero {
      margin: auto 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .welcome-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .chip-btn {
      padding: 6px 12px;
      background: var(--card-bg);
      border-radius: 9999px;
      border: none;
      font-size: 11.5px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .chip-btn:hover {
      background: var(--hover);
      color: var(--accent);
    }

    /* Message List */
    .msg-bubble {
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.45;
      max-width: 90%;
      word-break: break-word;
    }

    .msg-user {
      align-self: flex-start;
      background: var(--accent-light);
      color: var(--accent);
      border-bottom-left-radius: 4px;
    }

    .msg-ai {
      align-self: flex-end;
      background: var(--card-bg);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .img-preview-card {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 6px;
    }

    /* Bottom Input Capsule */
    .input-area {
      padding: 10px 14px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 9999px;
      padding: 4px 6px 4px 12px;
    }

    .chat-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text);
      user-select: text;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="overlay-card">
    <div class="header-bar">
      <div class="header-title">
        <img src="/static/hekki.png" class="header-logo" alt="Hekki" />
        <span>Hekki Super AI (Alt+Space)</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-snap" title="Capture Desktop Screen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
        <button class="icon-btn" id="btn-close" title="Hide Overlay (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="content-body" id="chat-body">
      <div class="welcome-hero" id="hero">
        <img src="/static/hekki.png" style="width: 42px; height: 42px; border-radius: 50%;" />
        <div class="welcome-text">Ask Super AI over Photoshop or any app</div>
        <div class="quick-chips">
          <button class="chip-btn" data-query="Capture screen and explain active window">📷 Analyze Screen</button>
          <button class="chip-btn" data-query="How to use desktop vision skills">💡 Vision Skills</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-capsule">
        <input type="text" class="chat-input" id="prompt-input" placeholder="Type prompt or vision command..." autocomplete="off" />
        <button class="send-btn" id="btn-send" title="Send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const chatBody = document.getElementById('chat-body');
    const hero = document.getElementById('hero');
    const promptInput = document.getElementById('prompt-input');
    const btnSend = document.getElementById('btn-send');
    const btnSnap = document.getElementById('btn-snap');
    const btnClose = document.getElementById('btn-close');

    function appendMessage(sender, text, imgUrl = null) {
      if (hero) hero.style.display = 'none';

      const div = document.createElement('div');
      div.className = `msg-bubble ${sender === 'user' ? 'msg-user' : 'msg-ai'}`;
      div.innerText = text;

      if (imgUrl) {
        const img = document.createElement('img');
        img.className = 'img-preview-card';
        img.src = imgUrl;
        div.appendChild(img);
      }

      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function sendQuery(text) {
      if (!text.trim()) return;
      appendMessage('user', text);
      promptInput.value = '';

      try {
        const res = await fetch('/api/quick-voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        const data = await res.json();
        appendMessage('ai', data.response_text || 'Completed', data.image_url);
      } catch (err) {
        appendMessage('ai', 'Error connecting to backend server.');
      }
    }

    btnSend.addEventListener('click', () => sendQuery(promptInput.value));
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuery(promptInput.value);
      if (e.key === 'Escape') hideOverlay();
    });

    btnSnap.addEventListener('click', () => sendQuery('capture screen and describe active window'));
    btnClose.addEventListener('click', hideOverlay);

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => sendQuery(btn.getAttribute('data-query')));
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideOverlay();
    });

    function hideOverlay() {
      if (window.electronAPI && window.electronAPI.hideOverlay) {
        window.electronAPI.hideOverlay();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
